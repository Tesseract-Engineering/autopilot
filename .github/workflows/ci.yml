name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows, as Claude Code's hooks use
    steps:
      - uses: actions/checkout@v4
      - name: python3 on Windows
        if: runner.os == 'Windows'
        run: |
          command -v python3 >/dev/null && exit 0
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/bin/python3"
          chmod +x "$HOME/bin/python3"
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - name: tools
        run: jq --version && python3 --version && git --version
      - name: script tests
        run: tests/run.sh
