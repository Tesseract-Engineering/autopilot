name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated plugin is up to date
        run: ./build.sh --check
      - name: script tests
        run: core/tests/run.sh
